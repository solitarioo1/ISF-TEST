<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISF Peru — Registro de Participación</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <a class="logo" href="#">
    <span class="logo-dot"></span>
    ISF Peru · Timesheet
  </a>
  <nav>
    <a href="index.html" class="active">Registro</a>
    <a href="dashboard.html">Mis horas</a>
  </nav>
</header>

<main>
  <div class="card">

    <div class="card-header">
      <span class="card-title">Nueva participación</span>
      <span class="badge" id="date-badge">—</span>
    </div>

    <form id="form-registro" novalidate>

      <div class="field">
        <label for="nombre">Miembro del equipo</label>
        <select id="nombre" name="nombre" required>
          <option value="">Selecciona tu nombre</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="dia">Día</label>
          <select id="dia" name="dia" required>
            <option value="">Selecciona el día</option>
          </select>
        </div>
        <div class="field">
          <label for="days_worked">Tiempo dedicado</label>
          <select id="days_worked" name="days_worked" required>
            <option value="">Selecciona</option>
            <option value="0.5">0.5 — Medio día</option>
            <option value="1">1 — Día completo</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="lugar">Lugar</label>
        <select id="lugar" name="lugar" required>
          <option value="">Selecciona</option>
          <option value="Remote">Remote</option>
          <option value="Field">Field</option>
        </select>
      </div>

      <hr>

      <div class="field">
        <label>Actividad</label>
        <div id="actividad-trigger" class="select-trigger" tabindex="0">
          <span id="actividad-label">Selecciona la actividad</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#78786e" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <input type="hidden" id="actividad" name="actividad">
      </div>

      <div class="field">
        <label>Proyecto</label>
        <div class="fixed-row">
          <span class="fixed-chip">ISF Peru</span>
        </div>
        <input type="hidden" name="proyecto" value="ISF Peru">
      </div>

    </form>

    <div class="card-footer">
      <span class="hint">Todos los campos son requeridos</span>
      <button type="submit" form="form-registro" id="btn-submit">Guardar registro</button>
    </div>

    <div class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Conectado · Google Drive listo</span>
    </div>

  </div>
</main>

<!-- Panel selector de actividad -->
<div id="actividad-overlay" class="picker-overlay" hidden>
  <div class="picker-panel">
    <div class="picker-header">
      <input type="text" id="actividad-search" placeholder="Buscar actividad..." autocomplete="off">
      <button type="button" id="actividad-close" class="picker-close">✕</button>
    </div>
    <ul id="actividad-list" class="picker-list"></ul>
  </div>
</div>

<!-- Modal de confirmación -->
<div id="modal-confirm" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">¿Confirmar registro?</span>
    </div>
    <div class="modal-body">
      <div class="conf-row"><span class="conf-label">Miembro</span><span id="conf-nombre" class="conf-value"></span></div>
      <div class="conf-row"><span class="conf-label">Día</span><span id="conf-dia" class="conf-value"></span></div>
      <div class="conf-row"><span class="conf-label">Tiempo</span><span id="conf-tiempo" class="conf-value"></span></div>
      <div class="conf-row"><span class="conf-label">Lugar</span><span id="conf-lugar" class="conf-value"></span></div>
      <div class="conf-row conf-actividad-row"><span class="conf-label">Actividad</span><span id="conf-actividad" class="conf-value"></span></div>
    </div>
    <div class="modal-footer">
      <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
      <button type="button" id="btn-confirmar" class="btn-primary">Confirmar y guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/form.js"></script>
</body>
</html>
