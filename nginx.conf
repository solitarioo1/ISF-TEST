server {
    listen 80;
    server_name isf-peru.miagentepersonal.me;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;

    # Imágenes y fuentes: caché larga (no cambian seguido)
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2|avif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # CSS y JS: siempre revalidar para que los cambios se vean al instante
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # HTML: sin caché para que siempre traiga la versión fresca
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location = /asistencia { try_files /index.html =404; }
    location = /horas      { try_files /dashboard.html =404; }
    location = /pin        { try_files /pin.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
