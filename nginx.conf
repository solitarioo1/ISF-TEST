server {
    listen 80;
    server_name isf-peru.miagentepersonal.me;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;

    # Archivos estáticos: caché agresiva
    location ~* \.(css|js|png|jpg|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # HTML: sin caché para que siempre traiga la versión fresca
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location = /asistencia { try_files /index.html =404; }
    location = /horas      { try_files /dashboard.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
